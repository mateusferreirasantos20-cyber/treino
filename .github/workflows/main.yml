name: Executar Script Python

on: [push]

jobs:
  rodar-python:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar o arquivo Python
        run: python bl.py
